# Vhost do painel Laravel/Filament do Canal de Cortes. Bind-mount único deste
# arquivo é feito pelo wordpress/docker-compose.yml no serviço nginx. Não
# incluir referência a nenhum outro projeto.
server {
    listen       80;
    server_name  canaldecortes.local;

    root   /var/www/html/painel/public;
    index  index.php;

    client_max_body_size 128m;
    charset utf-8;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }

    add_header X-Frame-Options "SAMEORIGIN";

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_vary on;

    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_pass php:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_intercept_errors on;
        fastcgi_read_timeout 900;
    }
}
