services:
  nginx:
    image: nginx:alpine
    container_name: nginx
    restart: always
    mem_limit: 128m
    ports:
      - "${APP_PORT:-80}:80"
      - "${APP_SSL_PORT:-443}:443"
    volumes:
      - ./docker/nginx/canaldecortes.conf:/etc/nginx/conf.d/default.conf:ro
      - ./painel:/var/www/html/painel
    depends_on:
      - php
    networks:
      - internal

  php:
    build:
      context: .
      dockerfile: Dockerfile.php
    container_name: php
    restart: always
    mem_limit: 1g
    command: php-fpm
    volumes:
      - ./painel:/var/www/html/painel
      - ./youtube:/var/www/html/youtube
      - ./branding:/var/www/html/painel/storage/app/branding
      - ${VIDEOS_DIR:-/mnt/videos/videos}:/var/www/html/painel/storage/app/clips-videos:ro
      # Arquivo da aula das transcrições (worker do Mac grava por rsync). Leitura e
      # escrita: o painel apaga o arquivo junto com a transcrição.
      - ${CURSOS_DIR:-/mnt/videos/conteudo-cursos}:/var/www/html/painel/storage/app/private/conteudo-cursos
    environment:
      PHP_MEMORY_LIMIT: 512M
      MAX_UPLOADS_PER_DAY: ${MAX_UPLOADS_PER_DAY:-6}
    networks:
      - internal
    depends_on:
      - redis
      - postgres

  postgres:
    image: postgres:17-alpine
    container_name: postgres
    restart: always
    mem_limit: 1g
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-clips_automation}
      POSTGRES_USER: ${POSTGRES_USER:-clips_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?falta_POSTGRES_PASSWORD_no_env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-clips_user} -d ${POSTGRES_DB:-clips_automation}']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal

  redis:
    image: redis:alpine
    container_name: redis
    restart: always
    mem_limit: 256m
    volumes:
      - redis_data:/data
    networks:
      - internal

  clip-processor:
    build: ./clip-processor
    container_name: clip-processor
    restart: unless-stopped
    mem_limit: 6g
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - GROQ_API_KEY=${GROQ_API_KEY}
      - DB_CONNECTION=pgsql
      - POSTGRES_HOST=postgres
      - POSTGRES_DB=${POSTGRES_DB:-clips_automation}
      - POSTGRES_USER=${POSTGRES_USER:-clips_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?falta_POSTGRES_PASSWORD_no_env}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - PIPELINE_ENABLED=${PIPELINE_ENABLED:-false}
      - MANUAL_APPROVAL_REQUIRED=${MANUAL_APPROVAL_REQUIRED:-false}
      - YOUTUBE_PRIVACY_STATUS=${YOUTUBE_PRIVACY_STATUS:-public}
      - YOUTUBE_WAIT_FOR_HD=${YOUTUBE_WAIT_FOR_HD:-true}
      - AI_PROVIDER=${AI_PROVIDER:-groq}
      - GROQ_CHAT_MODEL=${GROQ_CHAT_MODEL:-openai/gpt-oss-20b}
      - MAX_UPLOADS_PER_DAY=${MAX_UPLOADS_PER_DAY:-6}
      - MAX_LONGO_UPLOADS_PER_DAY=${MAX_LONGO_UPLOADS_PER_DAY:-3}
      - MAX_CURTO_UPLOADS_PER_DAY=${MAX_CURTO_UPLOADS_PER_DAY:-3}
      - ABSOLUTE_MAX_UPLOADS_PER_DAY=${ABSOLUTE_MAX_UPLOADS_PER_DAY:-6}
      - LONG_UPLOAD_HOURS=${LONG_UPLOAD_HOURS:-6,14,22}
      - SHORTS_PEAK_HOURS=${SHORTS_PEAK_HOURS:-12,20}
      - FRESHNESS_DAYS=${FRESHNESS_DAYS:-1500}
      - SHORTS_MAX_DURATION_SECONDS=${SHORTS_MAX_DURATION_SECONDS:-45}
      - MIN_UPLOAD_INTERVAL_MINUTES=${MIN_UPLOAD_INTERVAL_MINUTES:-60}
      - YOUTUBE_CLIENT_SECRETS=/app/youtube/client_secret.json
      - UPLOAD_WINDOW_BYPASS=${UPLOAD_WINDOW_BYPASS:-false}
      - ALLOW_LOCAL_DOWNLOAD=true
      - VIDEO_RENDER_MODE=${VIDEO_RENDER_MODE:-quality}
      - FFMPEG_PRESET=${FFMPEG_PRESET:-slow}
      - FFMPEG_CRF=${FFMPEG_CRF:-14}
      - DOWNLOAD_MAX_PER_SOURCE_CHANNEL=${DOWNLOAD_MAX_PER_SOURCE_CHANNEL:-2}
      - CLIP_PROCESSOR_INTERNAL_TOKEN=${CLIP_PROCESSOR_INTERNAL_TOKEN}
      - LARAVEL_NOTIFY_URL=http://nginx/internal/pipeline-event
      - LARAVEL_HOST_HEADER=${LARAVEL_HOST_HEADER:-toolscut.alessandromelo.com.br}
    volumes:
      - ./youtube:/app/youtube
      - ${VIDEOS_DIR:-/mnt/videos/videos}:/app/videos
      - ./assets:/app/assets:ro
      - ./branding:/app/branding:ro
      - ./clip-processor/src:/app/src
    networks:
      - internal
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

volumes:
  postgres_data:
  redis_data:

networks:
  internal:
    driver: bridge
