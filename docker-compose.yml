name: ${COMPOSE_PROJECT_NAME:-canaldecortes}

x-panel-build: &panel-build
  build:
    context: .
    dockerfile: docker/php/Dockerfile
  image: canaldecortes-panel:local

x-panel-runtime-env: &panel-runtime-env
  DB_CONNECTION: pgsql
  DB_HOST: postgres
  DB_PORT: 5432
  DB_DATABASE: ${POSTGRES_DB:-clips_automation}
  DB_USERNAME: ${POSTGRES_USER:-clips_user}
  DB_PASSWORD: ${CLIPS_DB_PASSWORD:?CLIPS_DB_PASSWORD is required}

x-clip-runtime: &clip-runtime
  build:
    context: ./clip-processor
  image: canaldecortes-clip-processor:local
  env_file:
    - ./.env
  environment:
    POSTGRES_HOST: postgres
    POSTGRES_DATABASE: ${POSTGRES_DB:-clips_automation}
    POSTGRES_USER: ${POSTGRES_USER:-clips_user}
    POSTGRES_PASSWORD: ${CLIPS_DB_PASSWORD:?CLIPS_DB_PASSWORD is required}
    REDIS_HOST: redis
    REDIS_PORT: 6379
    ASSETS_DIR: ${ASSETS_DIR:-/app/assets}
    PIPELINE_ENABLED: ${PIPELINE_ENABLED:-true}
    BURNED_SUBTITLE_DETECTION: ${BURNED_SUBTITLE_DETECTION:-true}
    YOUTUBE_CLIENT_SECRETS: ${YOUTUBE_CLIENT_SECRETS:-/app/youtube/client_secret.json}
    LARAVEL_NOTIFY_URL: http://nginx/internal/pipeline-event
    LARAVEL_HOST_HEADER: canaldecortes.local
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
    nginx:
      condition: service_started
  volumes:
    - ./clip-processor/src:/app/src
    - ./videos:/app/videos
    - ./assets:/app/assets:ro
    - ./branding:/app/branding:ro
    - ./youtube:/app/youtube
  restart: unless-stopped

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-clips_automation}
      POSTGRES_USER: ${POSTGRES_USER:-clips_user}
      POSTGRES_PASSWORD: ${CLIPS_DB_PASSWORD:?CLIPS_DB_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    restart: unless-stopped

  postgres-backup:
    image: postgres:16-alpine
    profiles: ["backup"]
    environment:
      PGHOST: postgres
      PGDATABASE: ${POSTGRES_DB:-clips_automation}
      PGUSER: ${POSTGRES_USER:-clips_user}
      PGPASSWORD: ${CLIPS_DB_PASSWORD:?CLIPS_DB_PASSWORD is required}
      BACKUP_DIR: /backups
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-30}
    volumes:
      - ${POSTGRES_BACKUP_DIR:-./backups/postgres}:/backups
      - ./scripts/postgres-backup-loop.sh:/usr/local/bin/postgres-backup-loop.sh:ro
    command: ["/bin/sh", "/usr/local/bin/postgres-backup-loop.sh"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  panel-init:
    <<: *panel-build
    env_file:
      - ./painel/.env
    environment: *panel-runtime-env
    command: ["/usr/local/bin/bootstrap-panel"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  php:
    <<: *panel-build
    env_file:
      - ./painel/.env
    environment: *panel-runtime-env
    command: ["php-fpm", "-F"]
    depends_on:
      panel-init:
        condition: service_completed_successfully
    volumes:
      - ./videos:/var/www/html/videos:ro
      - ./branding:/var/www/html/branding
      - ./youtube:/var/www/html/youtube:ro
    healthcheck:
      test: ["CMD-SHELL", "php-fpm -t"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  queue:
    <<: *panel-build
    env_file:
      - ./painel/.env
    environment: *panel-runtime-env
    command: ["php", "artisan", "queue:work", "--sleep=3", "--tries=3", "--timeout=90"]
    depends_on:
      panel-init:
        condition: service_completed_successfully
    volumes:
      - ./videos:/var/www/html/videos:ro
      - ./branding:/var/www/html/branding
      - ./youtube:/var/www/html/youtube:ro
    restart: unless-stopped

  scheduler:
    <<: *panel-build
    env_file:
      - ./painel/.env
    environment: *panel-runtime-env
    command: ["php", "artisan", "schedule:work"]
    depends_on:
      panel-init:
        condition: service_completed_successfully
    volumes:
      - ./videos:/var/www/html/videos:ro
      - ./branding:/var/www/html/branding
      - ./youtube:/var/www/html/youtube:ro
    restart: unless-stopped

  nginx:
    build:
      context: .
      dockerfile: docker/nginx/Dockerfile
    image: canaldecortes-nginx:local
    ports:
      - "${APP_PORT:-8088}:80"
    depends_on:
      php:
        condition: service_healthy
    restart: unless-stopped

  clip-processor:
    <<: *clip-runtime
    command: ["python", "-m", "src.sidecar"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/health')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  clip-poller:
    <<: *clip-runtime
    command: ["python", "-m", "src.worker", "--stage", "poll"]

  clip-downloader:
    <<: *clip-runtime
    command: ["python", "-m", "src.worker", "--stage", "download"]

  clip-ai:
    <<: *clip-runtime
    command: ["python", "-m", "src.worker", "--stage", "ai"]

  clip-renderer:
    <<: *clip-runtime
    command: ["python", "-m", "src.worker", "--stage", "render"]

  clip-publisher:
    <<: *clip-runtime
    command: ["python", "-m", "src.worker", "--stage", "publish", "--interval", "30"]

  clip-maintenance:
    <<: *clip-runtime
    command: ["python", "-m", "src.worker", "--stage", "maintenance"]

volumes:
  postgres_data:
  redis_data:
