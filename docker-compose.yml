services:
  nginx:
    image: nginx:alpine
    container_name: nginx
    restart: always
    mem_limit: 128m
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./docker/nginx/canaldecortes.conf:/etc/nginx/conf.d/default.conf:ro
      - ./painel:/var/www/html/painel
    depends_on:
      - php
    networks:
      - internal

  php:
    build:
      context: .
      dockerfile: Dockerfile.php
    container_name: php
    restart: always
    mem_limit: 1g
    command: php-fpm
    volumes:
      - ./painel:/var/www/html/painel
      - ./youtube:/var/www/html/youtube
      - ./branding:/var/www/html/painel/storage/app/branding
      - ${VIDEOS_DIR:-/mnt/videos/videos}:/var/www/html/painel/storage/app/clips-videos:ro
      # Arquivo da aula das transcrições (worker do Mac grava por rsync). Leitura e
      # escrita: o painel apaga o arquivo junto com a transcrição.
      - ${CURSOS_DIR:-/mnt/videos/conteudo-cursos}:/var/www/html/painel/storage/app/private/conteudo-cursos
    environment:
      PHP_MEMORY_LIMIT: 512M
      MAX_UPLOADS_PER_DAY: "${MAX_UPLOADS_PER_DAY:-5}"
    networks:
      - internal
    depends_on:
      - redis
      - postgres

  postgres:
    # Imagem própria: postgres:17-alpine + pgvector (docker/postgres/Dockerfile).
    # Trocar a imagem NÃO acontece no deploy comum (up -d --no-recreate); siga o
    # runbook do DEPLOY.md. Nunca `down -v`: o volume postgres_data é o banco.
    build: ./docker/postgres
    image: canaldecortes-postgres:pg17-vector
    container_name: postgres
    restart: always
    # 2g: o índice HNSW do pgvector é construído em memória (maintenance_work_mem).
    mem_limit: 2g
    command: ['postgres', '-c', 'maintenance_work_mem=256MB']
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-clips_automation}
      POSTGRES_USER: ${POSTGRES_USER:-clips_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?falta_POSTGRES_PASSWORD_no_env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-clips_user} -d ${POSTGRES_DB:-clips_automation}']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal

  # Sidecar de embeddings da busca semântica nas transcrições. Só rede interna
  # (sem porta publicada); o painel chama http://embedder:8000 com Bearer token.
  embedder:
    build: ./embedder
    container_name: embedder
    restart: unless-stopped
    mem_limit: 1g
    environment:
      # Sem valor default seguro: defina no .env do servidor (o embedder deve recusar
      # subir/atender com token vazio). Não é `:?` para não derrubar todo `docker
      # compose` (inclusive o deploy) antes de o token existir.
      EMBEDDER_TOKEN: ${EMBEDDER_TOKEN:-}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-intfloat/multilingual-e5-small}
      EMBEDDING_DIM: ${EMBEDDING_DIM:-384}
    healthcheck:
      test: ['CMD', 'python', '-c', "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    networks:
      - internal

  redis:
    image: redis:alpine
    container_name: redis
    restart: always
    mem_limit: 256m
    volumes:
      - redis_data:/data
    networks:
      - internal

  clip-processor:
    build: ./clip-processor
    container_name: clip-processor
    restart: unless-stopped
    mem_limit: 6g
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - GROQ_API_KEY=${GROQ_API_KEY}
      - DB_CONNECTION=pgsql
      - POSTGRES_HOST=postgres
      - POSTGRES_DB=${POSTGRES_DB:-clips_automation}
      - POSTGRES_USER=${POSTGRES_USER:-clips_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?falta_POSTGRES_PASSWORD_no_env}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - MANUAL_APPROVAL_REQUIRED=true
      - YOUTUBE_PRIVACY_STATUS=private
      - MAX_UPLOADS_PER_DAY=${MAX_UPLOADS_PER_DAY:-5}
      - MAX_LONGO_UPLOADS_PER_DAY=${MAX_LONGO_UPLOADS_PER_DAY:-2}
      # Cota por formato e espaçamento (plano do longo por canal). Vazio/0 = comportamento antigo:
      # sem teto de curtos e sem intervalo mínimo entre uploads.
      - MAX_CURTO_UPLOADS_PER_DAY=${MAX_CURTO_UPLOADS_PER_DAY:-}
      - MIN_UPLOAD_SPACING_MINUTES=${MIN_UPLOAD_SPACING_MINUTES:-0}
      - YOUTUBE_CLIENT_SECRETS=/app/youtube/client_secret.json
      - UPLOAD_WINDOW_BYPASS=true
      - ALLOW_LOCAL_DOWNLOAD=true
      # Teto de vagas da janela por canal de origem. Fixo em 2 por decisão do
      # operador (17/09/2026): com 10 canais do MBL ativos, o cálculo automático
      # daria 1 por canal — pouco para comparar canais entre si. Com 2, cada
      # canal entrega um par de cortes e dá para escolher o melhor.
      - DOWNLOAD_MAX_PER_SOURCE_CHANNEL=${DOWNLOAD_MAX_PER_SOURCE_CHANNEL:-2}
      - CLIP_PROCESSOR_INTERNAL_TOKEN=${CLIP_PROCESSOR_INTERNAL_TOKEN}
      - LARAVEL_NOTIFY_URL=http://nginx/internal/pipeline-event
      - LARAVEL_HOST_HEADER=toolscut.alessandromelo.com.br
    volumes:
      - ./youtube:/app/youtube
      - ${VIDEOS_DIR:-/mnt/videos/videos}:/app/videos
      - ./branding:/app/branding:ro
      - ./clip-processor/src:/app/src
    networks:
      - internal
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

volumes:
  postgres_data:
  redis_data:

networks:
  internal:
    driver: bridge
