services:
  nginx:
    image: nginx:alpine
    container_name: nginx
    restart: always
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./docker/nginx/canaldecortes.conf:/etc/nginx/conf.d/default.conf:ro
      - ./painel:/var/www/html/painel
    depends_on:
      - php
    networks:
      - internal

  php:
    build:
      context: .
      dockerfile: Dockerfile.php
    container_name: php
    restart: always
    command: php-fpm
    volumes:
      - ./painel:/var/www/html/painel
      - ./youtube:/var/www/html/youtube
      - ./branding:/var/www/html/painel/storage/app/branding
      - ./videos:/var/www/html/painel/storage/app/clips-videos:ro
    environment:
      PHP_MEMORY_LIMIT: 256M
      MAX_UPLOADS_PER_DAY: '5'
    networks:
      - internal
    depends_on:
      - redis
      - mysql

  mysql:
    image: mysql:8.4
    container_name: mysql
    restart: always
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-clips_automation}
      MYSQL_USER: ${MYSQL_USER:-clips_user}
      MYSQL_PASSWORD: ${CLIPS_DB_PASSWORD:-${MYSQL_PASSWORD:-gtaWxh9WZbUP6ugiHwZA}}
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - internal

  redis:
    image: redis:alpine
    container_name: redis
    restart: always
    volumes:
      - redis_data:/data
    networks:
      - internal

  clip-processor:
    build: ./clip-processor
    container_name: clip-processor
    restart: unless-stopped
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - GROQ_API_KEY=${GROQ_API_KEY}
      - MYSQL_HOST=mysql
      - MYSQL_DATABASE=${MYSQL_DATABASE:-clips_automation}
      - MYSQL_USER=${MYSQL_USER:-clips_user}
      - MYSQL_PASSWORD=${CLIPS_DB_PASSWORD:-${MYSQL_PASSWORD:-gtaWxh9WZbUP6ugiHwZA}}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - MANUAL_APPROVAL_REQUIRED=true
      - YOUTUBE_PRIVACY_STATUS=private
      - MAX_UPLOADS_PER_DAY=${MAX_UPLOADS_PER_DAY:-5}
      - MAX_LONGO_UPLOADS_PER_DAY=${MAX_LONGO_UPLOADS_PER_DAY:-2}
      - YOUTUBE_CLIENT_SECRETS=/app/youtube/client_secret.json
      - UPLOAD_WINDOW_BYPASS=true
      - CLIP_PROCESSOR_INTERNAL_TOKEN=${CLIP_PROCESSOR_INTERNAL_TOKEN}
      - LARAVEL_NOTIFY_URL=http://nginx/internal/pipeline-event
      - LARAVEL_HOST_HEADER=toolscut.alessandromelo.com.br
    volumes:
      - ./youtube:/app/youtube
      - ./videos:/app/videos
      - ./branding:/app/branding:ro
    networks:
      - internal
    depends_on:
      - mysql
      - redis

volumes:
  mysql_data:
  redis_data:

networks:
  internal:
    driver: bridge
