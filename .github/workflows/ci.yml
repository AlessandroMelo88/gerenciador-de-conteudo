# CI — espelha `make ci` mais os testes PHP (que exigem PostgreSQL + Redis).
# Detalhes de cada ferramenta: Docs/DESENVOLVIMENTO.md
name: CI

on:
  push:
    branches: [master, develop, "release/**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python:
    name: clip-processor · ruff + pytest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: clip-processor
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: clip-processor/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check . --output-format=github
      - run: ruff format --check .
      - run: mypy
      - run: pytest -q -p no:cacheprovider --cov --cov-report=term

  affiliate-worker:
    name: affiliate-worker · pytest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: affiliate-worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: affiliate-worker/requirements.txt
      - run: pip install -r requirements.txt
      - run: pytest -q -p no:cacheprovider --cov=. --cov-fail-under=85

  php-static:
    name: painel · pint + phpstan
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: painel
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: mbstring, intl, bcmath, pdo_pgsql, redis, zip
          coverage: none
          tools: composer:v2
      - uses: actions/cache@v4
        with:
          path: painel/vendor
          key: composer-${{ runner.os }}-${{ hashFiles('painel/composer.lock') }}
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: vendor/bin/pint --test
      - run: vendor/bin/phpstan analyse --memory-limit=1G --no-progress --error-format=github

  php-tests:
    name: painel · pest (postgres + redis)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: painel
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: clips_automation
          POSTGRES_USER: clips_user
          POSTGRES_PASSWORD: secret
        ports: ["5432:5432"]
        options: >-
          --health-cmd="pg_isready -h 127.0.0.1 -U clips_user -d clips_automation"
          --health-interval=5s --health-timeout=5s --health-retries=30
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s --health-timeout=3s --health-retries=20
    env:
      APP_ENV: testing
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: "5432"
      DB_DATABASE: clips_automation
      DB_USERNAME: clips_user
      DB_PASSWORD: secret
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: "6379"
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
      CLIP_PROCESSOR_INTERNAL_TOKEN: ci-token
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: mbstring, intl, bcmath, pdo_pgsql, redis, zip
          coverage: none
          tools: composer:v2
      - uses: actions/cache@v4
        with:
          path: painel/vendor
          key: composer-${{ runner.os }}-${{ hashFiles('painel/composer.lock') }}
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: cp .env.example .env && php artisan key:generate --force
      - run: php artisan migrate --force --no-interaction
      - run: php artisan test

  frontend:
    name: painel · tsc + oxlint + prettier + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: painel
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: painel/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm run test:coverage
      - run: npm run build

  e2e:
    name: painel · playwright e2e (lento)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: painel
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: clips_automation
          POSTGRES_USER: clips_user
          POSTGRES_PASSWORD: secret
        ports: ["5432:5432"]
        options: >-
          --health-cmd="pg_isready -h 127.0.0.1 -U clips_user -d clips_automation"
          --health-interval=5s --health-timeout=5s --health-retries=30
    env:
      APP_ENV: testing
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: "5432"
      DB_DATABASE: clips_automation
      DB_USERNAME: clips_user
      DB_PASSWORD: secret
      CACHE_STORE: array
      SESSION_DRIVER: file
      QUEUE_CONNECTION: sync
      CLIP_PROCESSOR_INTERNAL_TOKEN: ci-token
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: mbstring, intl, bcmath, pdo_pgsql, redis, zip
          coverage: none
          tools: composer:v2
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: painel/package-lock.json
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: cp .env.example .env && php artisan key:generate --force
      - run: php artisan migrate --force --no-interaction
      - run: php artisan db:seed --class=E2ESeeder --force
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            painel/playwright-report
            painel/test-results
          retention-days: 7

  infra:
    name: infra · shellcheck + hadolint + yamllint + compose
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -q && sudo apt-get install -y -q shellcheck
      - run: shellcheck -S warning scripts/*.sh manual-workflow/*.sh docker/php/bootstrap-panel
      - uses: hadolint/hadolint-action@v3.1.0
        with:
          recursive: true
          config: .hadolint.yaml
      - run: pip install yamllint && yamllint -c .yamllint.yml .
      - name: docker compose config
        env:
          POSTGRES_PASSWORD: ci
          CLIPS_DB_PASSWORD: ci
        run: cp .env.example .env && cp painel/.env.example painel/.env && docker compose config -q

  # Portão único para branch protection: exigir só "CI gate" garante que todos os jobs acima passaram.
  gate:
    name: CI gate
    if: always()
    needs: [python, affiliate-worker, php-static, php-tests, frontend, e2e, infra]
    runs-on: ubuntu-latest
    steps:
      - name: Todos os jobs precisam ter passado
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "resultados: $RESULTS"
          for r in $RESULTS; do
            [ "$r" = "success" ] || { echo "job falhou/cancelado/pulado: $r"; exit 1; }
          done
